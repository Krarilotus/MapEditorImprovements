menu_group: Поведение редактора
menu_group_descr: Управляет отображением и обновлением редактора.
menu_compass: Показывать север в редакторе
menu_compass_tooltip: Определяйте север по неподвижному компасу вверху слева (под «Отменой» и «Повтором», если они включены).
menu_compass_turn: Ctrl меняет направление поворота карты
menu_compass_turn_tooltip: Откройте кольцо правой кнопкой и удерживайте Ctrl при наведении на компас для поворота против часовой стрелки.
menu_dust_clouds: Предотвращать вылеты из-за облаков пыли
menu_dust_clouds_tooltip: Предотвращает вылеты из-за облаков пыли при редактировании карты.
menu_always_update: Обновлять панель редактора во время работы
menu_always_update_tooltip: Поддерживает элементы управления редактора актуальными, пока курсор находится над картой.
castle_all_players: Показывать все восемь щитов игроков
castle_all_players_tooltip: В режиме замка можно выбрать любой из восьми щитов рядом с мини-картой.
castle_all_keeps: Поместье и крепость на любой карте
castle_all_keeps_tooltip: Выбирайте Поместье или Крепость в «Цитаделях» на карте любого типа.
castle_player_zero: Показывать щит нейтрального игрока
castle_player_zero_tooltip: Нажмите девятый белый щит рядом с мини-картой, чтобы ставить объекты игрока 0.
castle_keep_ground: Сохранять рельеф при установке цитаделей
castle_keep_ground_tooltip: Ставит цитадели, не выравнивая землю под ними.
castle_rotation: Список поворота зданий
castle_rotation_tooltip: В режиме замка нажмите «Поворот» прямо над нижним левым меню и выберите угол перед установкой поддерживаемого здания.
castle_unit_colour: Выбирать цвет юнитов отдельно от владельца
castle_unit_colour_tooltip: Выберите герб над меню европейских или арабских войск, чтобы изменить цвет юнита.
castle_keep_crests: Выбирать активную цитадель по её гербу
castle_keep_crests_tooltip: При нескольких цитаделях клик по гербу выбирает или снимает активную цитадель. Подсказка при наведении включена по умолчанию.
castle_wall_tools: Высоты стен и отдельные зубцы
castle_wall_tools_tooltip: Выберите стены или лестницы и используйте кнопки над меню. Кнопка «Сброс» рядом возвращает исходные настройки.
trees_spread_order: Группировать деревья по почве разрастания
trees_spread_order_tooltip: Группирует деревья в «Растительности» по типу почвы, на которой они растут. Кусты по умолчанию вынесены в отдельный ряд.
trees_spread_outlines: Отмечать почву разрастания деревьев
trees_spread_outlines_tooltip: В «Растительности» зелёный отмечает деревья плодородной почвы, а бежевый — бесплодной.
herds_bird_bins: Удалить всех ворон или чаек
herds_bird_bins_tooltip: В «Животных» нажмите корзину рядом со значком вороны или чайки, чтобы убрать этот вид птиц.
herds_group_warning: Предупреждать вблизи лимита стад
herds_group_warning_tooltip: Показывает оставшиеся слоты, когда число стад и групп войск приближается к лимиту карты.
eraser_choice: Выбрать, что удаляет ластик
eraser_choice_tooltip: Выберите «Ластик», затем над меню укажите «Всё», «Животные», «Юниты», «Здания», «Растительность» или «Камни».
eraser_seagulls: Стирать летящих чаек
eraser_seagulls_tooltip: Используйте «Ластик», чтобы удалять летящих чаек. При включённых режимах ластика выберите «Животные» или «Всё».
map_settings_show_locked: Показывать заблокированные карты в «Загрузить»
map_settings_show_locked_tooltip: Отметьте «Показать заблокированные карты» под списком файлов в окне загрузки редактора.
map_settings_menu: Расширенные настройки карты
map_settings_menu_tooltip: Нажмите Alt+, в редакторе, перетащите «Свой размер» и отпустите для изменения. Кнопка «Настройки карты» над «К карте» включена по умолчанию.
map_settings_size_refresh: Применять уменьшение карты сразу
map_settings_size_refresh_tooltip: Применяет меньший размер карты во время редактирования и сразу показывает новые границы.
map_settings_camera_edge: Показывать весь край карты
map_settings_camera_edge_tooltip: Подведите камеру к краю, чтобы видеть самые крайние клетки карты.
eraser_group: Ластик
eraser_group_descr: Выбирает, что именно очищает ластик рельефа.
map_settings_group: Настройки карты
map_settings_group_descr: Изменение типа карты, размеров и флагов, а также просмотр заблокированных карт.
qol: Удобство игры
grid_group: Сетка ресурсов
grid_key: Предлагаемая клавиша Alt для сетки
grid_outside_editor: Разрешить сетку во время игры
grid_flattened_only: Сетка только в плоском виде
grid_hide_in_v_view: Скрывать сетку в виде V
grid_colour: Цвет сетки
grid_rotation_group: Ориентация замка
grid_rotation_lines: Показывать границы поворота цитадели
grid_mine_group: Размер железного рудника
grid_mine_boxes: Показать площадь железного рудника
