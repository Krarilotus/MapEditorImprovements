counts_group: Счётчики карты
counts_group_descr: Показывает, насколько карта близка к лимитам объектов.
counts_enabled: Счётчики объектов карты
counts_enabled_tooltip: Нажмите красную i над кнопкой ключа, затем наведите на «Животные», «Растительность», «Камни» или их элементы.
trees_group: Деревья и кусты
trees_group_descr: Размещение и упорядочивание растительности в режиме рельефа.
trees_growth: Размер кисти задаёт зрелость деревьев
trees_growth_tooltip: Выберите дерево и размер кисти в «Растительности». Размер 4 — взрослое дерево, 6 и 7 ставят сухие деревья.
trees_apple: Яблоня в «Растительности»
trees_apple_tooltip: Выберите яблоню в «Растительности» перед посадкой.
trees_shrubs: Цвета кустов
trees_shrubs_tooltip: Выберите куст в «Растительности», затем укажите цвет в строке над меню.
trees_felled: Варианты поваленных деревьев
trees_felled_tooltip: Выберите дерево в «Растительности» и укажите вариант по числу брёвен в строке над меню.
trees_random_mix: Случайная смесь растительности
trees_random_mix_tooltip: Нажмите ? в строке вариантов куста или дерева для смешивания. Повторное нажатие или другой вариант отключает режим.
trees_obstacles: Деревья рядом с препятствиями
trees_obstacles_tooltip: Поставьте верхнюю галочку справа от «Растительности», чтобы сажать деревья вплотную к препятствиям.
trees_rocks_and_water: Растительность на камнях и воде
trees_rocks_and_water_tooltip: Поставьте нижнюю галочку справа от «Растительности», чтобы сажать на камнях и воде.
trees_preview: Предпросмотр растительности под курсором
trees_preview_tooltip: При обычном масштабе наведите курсор на карту, чтобы увидеть выбранное дерево или куст.
trees_no_stacking: Запретить наслоение растительности
trees_no_stacking_tooltip: Не даёт растительности наслаиваться на одной клетке и очищает старые слои ластиком.
textures_group: Текстуры грунта
textures_group_descr: Настраивает рисование текстур земли кистью рельефа.
textures_gravel_and_iron: Гравий и железо в «Текстурах»
textures_gravel_and_iron_tooltip: Выберите «Гравий» или «Железо» в «Текстурах» и нарисуйте на карте.
textures_mask: Закрашивать только исходную текстуру
textures_mask_tooltip: Нажмите наполовину закрашенный квадрат вверху слева, затем начинайте каждый мазок с заменяемой текстуры.
textures_mask_by_type: Считать варианты воды одной текстурой
textures_mask_by_type_tooltip: При включённой маске рисует поверх вариантов исходной текстуры моря, реки или брода.
water_group: Вода
water_group_descr: Рисование деталей рек в режиме рельефа.
water_decorations: Пена и мелкие волны в «Воде»
water_decorations_tooltip: Выберите «Пену» или «Мелкие волны» в «Воде» и наносите на клетки реки.
water_foam_on_sea: Превращать клетки моря в пенящуюся реку
water_foam_on_sea_tooltip: Нанесите «Пену» из меню «Вода» на клетки моря, чтобы превратить их в реку.
rocks_group: Камни
rocks_group_descr: Размещение, поворот и удаление камней в режиме рельефа.
rocks_signpost: Указатель на картах схватки
rocks_signpost_tooltip: Откройте «Камни» на карте схватки и выберите «Указатель».
rocks_random_preview: Случайный угол камня при каждой установке
rocks_random_preview_tooltip: В «Рельефе → Камнях» выберите размер и нажмите «Случайный поворот». Предпросмотр меняет угол после каждой попытки.
rocks_variants: Выбор варианта камня
rocks_variants_tooltip: Выберите размер камня и нажмите вариант над «Камнями». Для самого малого размера по умолчанию доступен пятый камень.
rocks_invisible: Размещать невидимые камни
rocks_invisible_tooltip: Поставьте галочку справа от «Камней» перед установкой. Невидимые камни блокируют проход и стройку.
rocks_erase_invisible: Стирать невидимые камни
rocks_erase_invisible_tooltip: Используйте ластик рельефа для очистки клеток с невидимыми камнями.
rocks_remove_lost: Очистить потерянные записи камней
rocks_remove_lost_tooltip: Нажмите «Удалить потерянные камни» внизу справа от «Камней», чтобы освободить слоты без изменения клеток.
heights_group: Высоты
heights_group_descr: Изменение высот рельефа в режиме ландшафта.
heights_max_height: Максимальная высота в «Высотах»
heights_max_height_tooltip: Выберите «Макс. высоту» рядом с «Мин. высотой», чтобы поднять землю под кистью до максимума.
heights_tool_options: Настройки кисти высот
heights_tool_options_tooltip: Выберите инструмент «Высот», чтобы настроить охват, силу, защиту рельефа и обработку камней над меню.
heights_invert_key: Удерживать для обращения «Выравнивания»
heights_invert_key_tooltip: При выбранном «Выравнивании» удерживайте эту клавишу, чтобы делать землю неровной, и отпустите для сглаживания.
castle_group: Режим замка
castle_group_descr: Размещение зданий и юнитов в режиме замка.
castle_building_counts: Счётчики зданий над мини-картой
castle_building_counts_tooltip: Показывает счётчики зданий над мини-картой в режиме замка. Всплывающий текст по умолчанию сдвигается в сторону.
castle_tower_ruins: Руины башен
castle_tower_ruins_tooltip: Выберите руины в строке вариантов над «Башнями».
castle_tunnel_and_tents: Вход в тоннель и осадные палатки
castle_tunnel_and_tents_tooltip: Выберите гильдию подкопщиков или инженеров, затем укажите вход или палатку над меню.
castle_statues: Дополнительная статуя и святилища
castle_statues_tooltip: Выберите статую или святилище и нужный вариант над меню, либо найдите новые объекты в «Добрых делах».
castle_barrier: Барьер в «Руинах»
castle_barrier_tooltip: Барьер находится внизу справа в меню «Руины».
castle_several_keeps: Несколько цитаделей на игрока
castle_several_keeps_tooltip: Ставьте дополнительные цитадели как обычно. При включённых гербах нажмите на герб, чтобы выбрать активную цитадель.
castle_several_storage: Несколько зданий хранения и найма
castle_several_storage_tooltip: Ставьте дополнительные здания как обычно. Раздельные склады могут менять доступность ресурсов поблизости.
castle_tower_engines: Ставить башенные орудия на проходимых клетках
castle_tower_engines_tooltip: Выберите башенное орудие в «Военных зданиях» и поставьте на проходимую клетку.
castle_keep_parts: Размещать части цитадели
castle_keep_parts_tooltip: Выберите цитадель и нажмите «Только цитадель» или «Без склада» в строке над «Цитаделями».
castle_damaged_walls: Ставить повреждённые стены или лестницы
castle_damaged_walls_tooltip: Выберите стену или лестницу и перед постройкой нажмите «Поврежд.» над меню зданий.
castle_variant_panels: Выбор варианта здания
castle_variant_panels_tooltip: Выберите поддерживаемое здание и нажмите нужный вариант в строке над меню зданий.
castle_ruined_cathedral: Ставить собор в виде руин
castle_ruined_cathedral_tooltip: Выберите разрушенный вариант над меню зданий. Работает как обычный собор.
castle_moat_kinds: Выбор типа рва
castle_moat_kinds_tooltip: "Выберите «Ров» в «Воротах» и укажите над меню: выкопанный, намеченный или постоянный."
castle_moat_on_marsh: Разрешить рвы на болоте
castle_moat_on_marsh_tooltip: Размещайте рвы на болоте. Засыпка рва восстанавливает болото под ним.
castle_moat_removal_keeps_ground: Сохранять рельеф при удалении рвов
castle_moat_removal_keeps_ground_tooltip: Удаление рва возвращает исходную землю под ним.
herds_group: Стада
herds_group_descr: Управление стадами и птицами в режиме рельефа.
herds_panel: Размер и поведение стада
herds_panel_tooltip: Выберите стадное животное и задайте его размер и поведение на панели над «Животными».
brushes_group: Кисти
brushes_group_descr: Меняет способ покрытия клеток кистью редактора.
brushes_full_shape: Исправить форму кисти
brushes_full_shape_tooltip: Заполняет весь контур предпросмотра кисти без двойного применения в центре.
undo_group: Отмена и повтор
undo_group_descr: Отмена и повтор недавних правок.
undo_enabled: Отмена и повтор
undo_enabled_tooltip: Нажимайте стрелки вверху слева (до 20 действий) или назначьте «Отмену» и «Повтор» в «Настройки > Горячие клавиши».
pipette_group: Пипетка
pipette_group_descr: Взятие образца клетки и повторное использование её содержимого на карте.
pipette_enabled: Копировать рельеф или объекты пипеткой
pipette_enabled_tooltip: Нажмите пипетку над размером кисти, выберите «Высоты», «Текстуры», «Объекты» или «Всё», кликните клетку-образец и рисуйте.
pipette_select_key: Клавиша пипетки
pipette_select_key_tooltip: Повторное нажатие переключает режимы; пипетку также можно назначить в «Настройки > Горячие клавиши».
pipette_read_key: Удерживать для выбора другой клетки
pipette_read_key_tooltip: Удерживайте эту клавишу при клике на новую клетку-образец пипеткой.
